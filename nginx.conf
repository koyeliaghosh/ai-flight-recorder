worker_processes 1;
events {
    worker_connections 1024;
}

http {
    server {
        listen 8080;
        
        # Route default traffic to Streamlit
        location / {
            proxy_pass http://127.0.0.1:8501/;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_redirect off;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        
        # Route /mlflow/ to MLflow server
        location /mlflow/ {
            proxy_pass http://127.0.0.1:5000/;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host 127.0.0.1;
            proxy_set_header Origin "";
            proxy_redirect off;
        }
        
        # MLflow API and static assets
        location /api/ {
            proxy_pass http://127.0.0.1:5000/api/;
            proxy_set_header Host 127.0.0.1;
            proxy_set_header Origin "";
        }
        location /ajax-api/ {
            proxy_pass http://127.0.0.1:5000/ajax-api/;
            proxy_set_header Host 127.0.0.1;
            proxy_set_header Origin "";
        }
        location /static-files/ {
            proxy_pass http://127.0.0.1:5000/static-files/;
            proxy_set_header Host 127.0.0.1;
        }
        location /get-artifact {
            proxy_pass http://127.0.0.1:5000/get-artifact;
            proxy_set_header Host 127.0.0.1;
        }
    }
}
